<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile And CST356 Static Web</title>

    <style>
        body {
            background-image: url("sitebg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #f8dce6;
            font-family: Georgia, serif;
            margin: 0;
            padding: 30px;
        }

        form {
            background-color: rgba(255, 248, 250, 0.94);
            width: 350px;
            max-width: 100%;
            box-sizing: border-box;
            margin: 30px auto;
            padding: 30px;
            border: 2px solid #d9a3b3;
            border-radius: 15px;
            box-shadow: 0 5px 20px #b87d91;
        }

        h1 {
            text-align: center;
            color: #a65d78;
            font-style: italic;
        }

        p {
            text-align: center;
            color: #ad8190;
            font-style: italic;
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #99566e;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            background-color: #fffafb;
            border: 1px solid #ddb3c1;
            border-radius: 7px;
            font-family: Georgia, serif;
        }

        textarea {
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid #d69bad;
        }

        input[type="submit"] {
            background-color: #c9859e;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            margin-top: 25px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #a65d78;
        }
    </style>
</head>

<body>
    
    <h1>CST356 Static Web</h1>
    <p>Welcome to my CST356 website!</p>
    <p><a href="syllabus.html">View Course Syllabus</a></p>

    <form action="https://otapp-cstwebdev.azurewebsites.net" method="POST">

        <h1>Student Profile</h1>
        <p> Click here for Syllabus: </p>
        <p>Tell us who you are!!!</p>

        <label for="StudentID">Student ID:</label>
        <input type="text" id="StudentID" name="StudentID"
               maxlength="9" placeholder="Enter your student ID">

        <label for="GraduationDate">Graduation Date:</label>
        <input type="date" id="GraduationDate" name="GraduationDate">

        <label for="Name">Full Name:</label>
        <input type="text" id="Name" name="Name"
               placeholder="First and Last Name">

        <label for="EmailAddress">Email Address:</label>
        <input type="Email" id="EmailAddress" name="EmailAddress"
               placeholder="example@email.com">

        <label for="Age">Age:</label>
        <input type="text" id="Age" name="Age"
               maxlength="3" pattern="[0-9]{1,3}"
               inputmode="numeric" placeholder="Your age">

        <label for="Hobby">Hobby:</label>
        <input type="text" id="Hobby" name="Hobby"
               placeholder="Your favorite thing to do in your free time">

        <label for="UserType">User Type:</label>
        <select id="UserType" name="UserType">
            <option value="Student">Student</option>
            <option value="Faculty/Staff">Faculty/Staff</option>
        </select>

        <label for="Band">Favorite Band:</label>
        <input type="text" id="Band" name="Band"
               placeholder="Favorite band or artist!">

        <label for="Biography">Biography:</label>
        <textarea id="Biography" name="Biography"
                  rows="4" placeholder="Give some details about yourself"></textarea>

        <input type="Hidden" name="SuperSecretText" value="secret info">

        <input type="Submit" value="Submit Profile">

    </form>

</body>
</html>
